services:

  # ─── Hive Metastore backend DB ────────────────────────────────────────────
  hive-metastore-db:
    image: postgres:15
    container_name: hive-metastore-db
    hostname: hive-metastore-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive-metastore-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - olap-network

  # ─── Hive Metastore ───────────────────────────────────────────────────────
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    hostname: hive-metastore
    depends_on:
      hive-metastore-db:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_METASTORE_URIS: ""
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    volumes:
      - hive-warehouse:/opt/hive/data/warehouse
      - ./hive-libs/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar
    ports:
      - "9083:9083"
    networks:
      - olap-network

  # ─── HiveServer2 (JDBC endpoint for Redash later) ─────────────────────────
  hiveserver2:
    image: apache/hive:3.1.3
    container_name: hiveserver2
    hostname: hiveserver2
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      SERVICE_OPTS: >-
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    volumes:
      - hive-warehouse:/opt/hive/data/warehouse
      - ./hive-libs/postgresql-42.7.3.jar:/opt/hive/lib/postgresql-42.7.3.jar
    ports:
      - "10000:10000"   # JDBC (Beeline / Redash)
      - "10002:10002"   # HiveServer2 Web UI
    networks:
      - olap-network

  # ─── Spark Master ─────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:4.1.2
    container_name: spark-master
    hostname: spark-master
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/spark/sbin/start-master.sh && tail -f /opt/spark/logs/*
    environment:
      - SPARK_NO_DAEMONIZE=false
      - SPARK_MASTER_HOST=spark-master
    volumes:
      - ../spark/hive-site.xml:/opt/spark/conf/hive-site.xml
      - hive-warehouse:/opt/hive/data/warehouse
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - olap-network

  # ─── Spark Worker ─────────────────────────────────────────────────────────
  spark-worker:
    image: apache/spark:4.1.2
    container_name: spark-worker
    hostname: spark-worker
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*
    environment:
      - SPARK_NO_DAEMONIZE=false
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
    volumes:
      - ../spark/hive-site.xml:/opt/spark/conf/hive-site.xml
      - hive-warehouse:/opt/hive/data/warehouse
    ports:
      - "8082:8081"
    depends_on:
      - spark-master
    networks:
      - olap-network

  # ─── Jupyter ──────────────────────────────────────────────────────────────
  jupyter:
    build:
      context: .          # docker/ folder (where Dockerfile lives)
      dockerfile: Dockerfile
    container_name: jupyter
    hostname: jupyter
    ports:
      - "8888:8888"
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    volumes:
      - ../spark/notebooks:/home/jovyan/work
      - ../spark/hive-site.xml:/opt/spark/conf/hive-site.xml
      - hive-warehouse:/opt/hive/data/warehouse
    depends_on:
      - spark-master
      - spark-worker
      - hive-metastore
    networks:
      - olap-network

# ─── Redash ───────────────────────────────────────────────────────────────
  redash-server:
    image: redash/redash:10.1.0.b50633
    container_name: redash-server
    hostname: redash-server
    depends_on:
      - redash-db
      - redash-redis
    environment:
      REDASH_WEB_WORKERS: 4
      REDASH_DATABASE_URL: "postgresql://redash:redash@redash-db/redash"
      REDASH_REDIS_URL: "redis://redash-redis:6379/0"
      REDASH_SECRET_KEY: "redash-secret-key-olap"
      REDASH_COOKIE_SECRET: "redash-cookie-secret-olap"
    command: server
    ports:
      - "5000:5000"
    networks:
      - olap-network
 
  redash-worker:
    image: redash/redash:10.1.0.b50633
    container_name: redash-worker
    depends_on:
      - redash-server
    environment:
      REDASH_DATABASE_URL: "postgresql://redash:redash@redash-db/redash"
      REDASH_REDIS_URL: "redis://redash-redis:6379/0"
      REDASH_SECRET_KEY: "redash-secret-key-olap"
      REDASH_COOKIE_SECRET: "redash-cookie-secret-olap"
    command: worker
    networks:
      - olap-network
 
  redash-scheduler:
    image: redash/redash:10.1.0.b50633
    container_name: redash-scheduler
    depends_on:
      - redash-server
    environment:
      REDASH_DATABASE_URL: "postgresql://redash:redash@redash-db/redash"
      REDASH_REDIS_URL: "redis://redash-redis:6379/0"
      REDASH_SECRET_KEY: "redash-secret-key-olap"
      REDASH_COOKIE_SECRET: "redash-cookie-secret-olap"
    command: scheduler
    networks:
      - olap-network
 
  redash-db:
    image: postgres:15
    container_name: redash-db
    hostname: redash-db
    environment:
      POSTGRES_DB: redash
      POSTGRES_USER: redash
      POSTGRES_PASSWORD: redash
    volumes:
      - redash-db-data:/var/lib/postgresql/data
    networks:
      - olap-network
 
  redash-redis:
    image: redis:7
    container_name: redash-redis
    hostname: redash-redis
    networks:
      - olap-network

networks:
  olap-network:
    external: true

volumes:
  hive-warehouse:
  hive-metastore-db-data:
  redash-db-data: